<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gacha Test</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    .gacha-tabs { display: flex; border-bottom: 1px solid #eee; }
    .gacha-tab { flex: 1; padding: 16px; background: none; border: none; cursor: pointer; font-size: 1rem; color: #999; border-bottom: 3px solid transparent; }
    .gacha-tab.active { color: #ff6b9d; border-bottom-color: #ff6b9d; }
    .gacha-content { padding: 24px; min-height: 200px; border: 1px solid #eee; margin-top: 10px; }
  </style>
</head>
<body>
  <h1>Gacha Tab Test</h1>
  
  <div class="gacha-tabs" id="test-tabs">
    <button class="gacha-tab active" data-tab="draw">🎁 抽奖</button>
    <button class="gacha-tab" data-tab="inventory">🎒 背包</button>
    <button class="gacha-tab" data-tab="shop">💳 商店</button>
  </div>
  
  <div class="gacha-content" id="test-content">
    <p>默认显示抽奖内容</p>
  </div>
  
  <div id="debug" style="margin-top: 20px; padding: 10px; background: #f0f0f0;"></div>
  
  <script>
    const debug = document.getElementById('debug');
    
    function log(msg) {
      console.log(msg);
      debug.innerHTML += '<p>' + msg + '</p>';
    }
    
    function switchGachaTab(tab) {
      log('switchGachaTab called with: ' + tab);
      
      // Update active state
      document.querySelectorAll('.gacha-tab').forEach(t => t.classList.remove('active'));
      const targetTab = document.querySelector('.gacha-tab[data-tab="' + tab + '"]');
      if (targetTab) {
        targetTab.classList.add('active');
        log('Found target tab: ' + targetTab.textContent);
      } else {
        log('Target tab NOT found!');
      }
      
      // Update content
      const content = document.getElementById('test-content');
      const contents = {
        'draw': '<p>🎁 抽奖内容 - 你有 5 张卡券</p>',
        'inventory': '<p>🎒 背包内容 - 空空如也</p>',
        'shop': '<p>💳 商店内容 - 暂无商品</p>'
      };
      content.innerHTML = contents[tab] || '<p>未知内容</p>';
    }
    
    // Test 1: Add event listeners directly
    log('Setting up event listeners...');
    
    const tabs = document.querySelectorAll('.gacha-tab');
    tabs.forEach(function(tab) {
      tab.addEventListener('click', function() {
        log('Click detected on: ' + this.textContent);
        const tabName = this.getAttribute('data-tab');
        log('Calling switchGachaTab with: ' + tabName);
        switchGachaTab(tabName);
      });
    });
    
    log('Event listeners set up complete. Click a tab to test.');
  </script>
</body>
</html>
