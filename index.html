<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍔 美味创意AI厨房 | 比奇堡蟹堡王特供</title>
  <!-- Marked.js for Markdown rendering -->
  <script src="https://cdn.jsdelivr.net/npm/marked/lib/marked.umd.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

    :root {
      --yellow:   #FFD700;
      --orange:   #FF8C00;
      --coral:    #FF6B6B;
      --teal:     #00CED1;
      --sky:      #87CEEB;
      --sand:     #F5DEB3;
      --cream:    #FFFDE7;
      --brown:    #8B4513;
      --green:    #3CB371;
      --bubble:   rgba(255,255,255,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #87CEEB 0%, #00CED1 40%, #F5DEB3 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── 气泡背景 ── */
    .bubbles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: var(--bubble);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(110vh) scale(1);   opacity: .6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0;  }
    }

    /* ── 主容器 ── */
    .container {
      position: relative; z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 32px 100px;
    }

    /* ── 头部 ── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-wrap {
      display: inline-block;
      background: var(--yellow);
      border-radius: 50%;
      width: 100px; height: 100px;
      line-height: 100px;
      font-size: 58px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.1);
      animation: bounce 2.4s ease-in-out infinite;
      margin-bottom: 14px;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0);    }
      50%      { transform: translateY(-10px); }
    }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0 var(--orange), 5px 5px 0 rgba(0,0,0,.15);
      letter-spacing: 1px;
    }
    .subtitle {
      margin-top: 8px;
      font-size: .95rem;
      color: rgba(255,255,255,.9);
      font-weight: 600;
      line-height: 1.5;
    }

    /* ── 卡片 ── */
    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 36px 36px 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
      margin-bottom: 32px;
    }

    /* ── 标签 ── */
    .label {
      font-size: .88rem;
      font-weight: 800;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── 输入框 ── */
    textarea {
      width: 100%;
      min-height: 120px;
      border: 2.5px solid var(--yellow);
      border-radius: 16px;
      padding: 16px 18px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      background: var(--cream);
      resize: vertical;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      line-height: 1.6;
    }
    textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255,140,0,.18);
    }
    textarea::placeholder { color: #bbb; font-weight: 400; line-height: 1.6; }

    /* ── 模式选择 ── */
    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 6px;
    }
    .mode-btn {
      flex: 1 1 calc(20% - 14px);
      min-width: 100px;
      padding: 14px 12px;
      border: 2.5px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 800;
      text-align: center;
      transition: all .2s;
      background: #f5f5f5;
      color: #555;
      user-select: none;
      line-height: 1.4;
    }
    .mode-btn .mode-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
    .mode-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.12); }

    .mode-btn.active[data-mode="normal"]   { background: #FFF9C4; border-color: #FFD700; color: #7a5c00; }
    .mode-btn.active[data-mode="michelin"] { background: #FCE4EC; border-color: #E91E63; color: #880E4F; }
    .mode-btn.active[data-mode="dark"]     { background: #EDE7F6; border-color: #673AB7; color: #311B92; }
    .mode-btn.active[data-mode="healing"]  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .mode-btn.active[data-mode="squat"]    { background: #E3F2FD; border-color: #2196F3; color: #0D47A1; }

    /* ── 按钮 ── */
    .cook-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--coral) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: .5px;
      box-shadow: 0 6px 20px rgba(255,107,107,.4);
      transition: all .2s;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .cook-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255,107,107,.5);
    }
    .cook-btn:active:not(:disabled) { transform: translateY(1px); }
    .cook-btn:disabled { opacity: .7; cursor: not-allowed; }
    .cook-btn .btn-shine {
      position: absolute; top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      animation: shine 2.5s ease-in-out infinite;
    }
    @keyframes shine {
      0%   { left: -100%; }
      50%  { left: 150%;  }
      100% { left: 150%;  }
    }

    /* ── 结果区 ── */
    #result-section { display: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .result-header h2 {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--brown);
    }
    .mode-badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 800;
      background: var(--yellow);
      color: var(--brown);
    }

    #recipe-output {
      line-height: 2;
      color: #333;
      font-size: 1rem;
      white-space: pre-wrap;
      word-break: break-word;
    }
    /* ── 食谱内容样式 ── */
    #recipe-output {
      line-height: 1.9;
      color: #333;
      font-size: 1rem;
    }
    
    /* 主标题 */
    #recipe-output .recipe-main-title {
      color: var(--brown);
      font-size: 1.6rem;
      font-weight: 900;
      margin: 0 0 20px 0;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--yellow);
      line-height: 1.3;
    }
    
    /* 章节标题 */
    #recipe-output .recipe-section {
      color: var(--orange);
      font-size: 1.25rem;
      font-weight: 800;
      margin: 28px 0 14px 0;
      padding-left: 12px;
      border-left: 4px solid var(--orange);
      line-height: 1.4;
    }
    
    /* 小标题 */
    #recipe-output .recipe-title {
      color: var(--brown);
      font-size: 1.1rem;
      font-weight: 700;
      margin: 20px 0 10px 0;
      line-height: 1.4;
    }
    
    /* 段落 */
    #recipe-output .recipe-paragraph {
      margin: 0 0 16px 0;
      text-align: justify;
    }
    
    /* 高亮 */
    #recipe-output .highlight {
      color: var(--orange);
      font-weight: 700;
    }
    
    /* 列表 */
    #recipe-output .recipe-list {
      padding-left: 28px;
      margin: 12px 0 20px 0;
    }
    #recipe-output .recipe-item {
      margin-bottom: 10px;
      line-height: 1.7;
    }
    #recipe-output .recipe-list.numbered {
      list-style: none;
      padding-left: 0;
      counter-reset: step;
    }
    #recipe-output .recipe-list.numbered .recipe-item {
      position: relative;
      padding-left: 36px;
      margin-bottom: 14px;
    }
    #recipe-output .recipe-list.numbered .recipe-item::before {
      content: attr(data-num);
      position: absolute;
      left: 0;
      top: 0;
      width: 26px;
      height: 26px;
      background: var(--orange);
      color: white;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
      font-weight: 700;
    }
    
    /* 分割线 */
    #recipe-output .recipe-divider {
      border: none;
      border-top: 2px dashed var(--yellow);
      margin: 24px 0;
    }
    
    /* 代码 */
    #recipe-output .recipe-inline-code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.9em;
      color: var(--coral);
    }
    #recipe-output .recipe-code {
      background: #f8f8f8;
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 16px 0;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.9rem;
      line-height: 1.6;
    }

    /* ── 加载动画 ── */
    .loading-wrap {
      text-align: center;
      padding: 36px 0;
      display: none;
    }
    .pan {
      font-size: 3.2rem;
      display: inline-block;
      animation: fry .6s ease-in-out infinite alternate;
    }
    @keyframes fry {
      0%   { transform: rotate(-12deg) translateY(0);  }
      100% { transform: rotate(12deg)  translateY(-8px); }
    }
    .loading-text {
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--brown);
      line-height: 1.5;
    }
    .dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: '';    }
      25%  { content: '.';   }
      50%  { content: '..';  }
      75%  { content: '...'; }
      100% { content: '';    }
    }

    /* ── 错误提示 ── */
    .error-box {
      background: #FFF3F3;
      border: 2px solid var(--coral);
      border-radius: 16px;
      padding: 16px 20px;
      color: #c0392b;
      font-weight: 700;
      display: none;
      margin-top: 16px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* ── 底部 ── */
    footer {
      text-align: center;
      color: rgba(255,255,255,.8);
      font-size: .85rem;
      font-weight: 600;
      margin-top: 12px;
      line-height: 1.6;
    }

    /* ── 响应式 ── */
    @media (max-width: 580px) {
      .container {
        padding: 40px 20px 80px;
      }
      .card {
        padding: 28px 24px 32px;
        margin-bottom: 24px;
      }
      .logo-wrap {
        width: 88px;
        height: 88px;
        line-height: 88px;
        font-size: 50px;
      }
      header {
        margin-bottom: 36px;
      }
      .mode-btn {
        flex: 1 1 calc(50% - 14px);
        padding: 14px 12px;
      }
      .modes {
        gap: 14px;
      }
      .label {
        margin-bottom: 14px;
        font-size: .85rem;
      }
      #result-header h2 {
        font-size: 1.2rem;
      }
      #recipe-output {
        font-size: .95rem;
        line-height: 1.9;
      }
      .cook-btn {
        padding: 18px;
        margin-bottom: 24px;
      }
    }

    @media (max-width: 380px) {
      .mode-btn {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

<!-- 气泡背景 -->
<div class="bubbles" id="bubbles"></div>

<div class="container">

  <!-- 头部 -->
  <header>
    <div class="logo-wrap">🧽</div>
    <h1>美味创意 AI 厨房</h1>
    <p class="subtitle">🦀 蟹老板御用 · 比奇堡最强食谱生成器 · 海绵宝宝亲自研发 🍔</p>
  </header>

  <!-- 输入卡片 -->
  <div class="card">
    <div class="label">🍽️ 告诉我你想吃什么 / 你的心情</div>
    <textarea
      id="user-input"
      placeholder="例如：我今天很累，想吃一碗暖暖的汤面 🍜&#10;或者：帮我做一道能让朋友惊艳的派对菜 🎉&#10;或者：我只有鸡蛋和番茄，能做什么？ 🍅"
    ></textarea>
  </div>

  <!-- 模式卡片 -->
  <div class="card">
    <div class="label">🔥 选择烹饪模式</div>
    <div class="modes">
      <button class="mode-btn active" data-mode="normal">
        <span class="mode-icon">🍳</span>普通模式
      </button>
      <button class="mode-btn" data-mode="michelin">
        <span class="mode-icon">⭐</span>米其林
      </button>
      <button class="mode-btn" data-mode="dark">
        <span class="mode-icon">💀</span>暗黑料理
      </button>
      <button class="mode-btn" data-mode="healing">
        <span class="mode-icon">🌸</span>治愈系
      </button>
      <button class="mode-btn" data-mode="squat">
        <span class="mode-icon">🏠</span>蹲门模式
      </button>
    </div>
  </div>

  <!-- 按钮 -->
  <button class="cook-btn" id="cook-btn" onclick="startCooking()">
    <span class="btn-shine"></span>
    🍔 开始烹饪！让海绵宝宝大显身手！
  </button>

  <!-- 加载 -->
  <div class="loading-wrap" id="loading">
    <div class="pan">🍳</div>
    <div class="loading-text">海绵宝宝正在厨房疯狂烹饪<span class="dots"></span></div>
  </div>

  <!-- 错误 -->
  <div class="error-box" id="error-box"></div>

  <!-- 结果卡片 -->
  <div class="card" id="result-section">
    <div class="result-header">
      <h2>🎉 食谱出炉啦！</h2>
      <span class="mode-badge" id="mode-badge"></span>
    </div>
    <div id="recipe-output"></div>
  </div>

  <footer>
    🧽 由海绵宝宝 × 蟹老板联合出品 · 比奇堡 AI 厨房 · 每一道菜都是爱 ❤️
  </footer>

</div>

<script>
  /* ── 气泡生成 ── */
  (function spawnBubbles() {
    const wrap = document.getElementById('bubbles');
    for (let i = 0; i < 22; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 18 + Math.random() * 60;
      b.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        animation-duration:${6+Math.random()*10}s;
        animation-delay:${-Math.random()*12}s;
        opacity:${0.2+Math.random()*0.4};
      `;
      wrap.appendChild(b);
    }
  })();

  /* ── 模式选择 ── */
  let currentMode = 'normal';
  const modeLabels = {
    normal:   '🍳 普通模式',
    michelin: '⭐ 米其林',
    dark:     '💀 暗黑料理',
    healing:  '🌸 治愈系',
    squat:    '🏠 蹲门模式',
  };
  const modePrompts = {
    normal:
      '你是一位热情友善的家庭厨师。请根据用户的描述，生成一份详细、实用、步骤清晰的家常食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（大标题）\n3. 用 ## 分隔不同章节（如：## 食材准备、## 烹饪步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表\n6. 重要内容用 **粗体** 标注\n7. 全文使用中文回复\n8. 多用 emoji 增加趣味性\n9. 段落之间空一行，保持清晰排版',
    michelin:
      '你是一位三星米其林主厨。请根据用户的描述，生成一份精致、高端、充满创意的米其林级别食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（大标题）\n3. 用 ## 分隔不同章节（如：## 食材准备、## 烹饪步骤、## 摆盘艺术）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表，注明精确用量\n6. 关键温度、时间用 **粗体** 标注\n7. 全文使用中文回复，可穿插法语术语\n8. 多用 emoji 增加格调\n9. 段落之间空一行，保持优雅排版',
    dark:
      '你是一位专门研究"暗黑料理"的疯狂厨师。请根据用户的描述，生成一份充满奇葩创意、脑洞大开的暗黑食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（要很奇葩）\n3. 用 ## 分隔不同章节（如：## 诡异食材、## 黑暗步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表\n6. 夸张描述用 **粗体** 标注\n7. 全文使用中文回复\n8. 多用 💀🧪⚗️ 等暗黑 emoji\n9. 段落之间空一行，营造戏剧感',
    healing:
      '你是一位温柔的治愈系厨师。请根据用户的描述，生成一份充满爱与温暖的治愈系食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（温暖系）\n3. 用 ## 分隔不同章节（如：## 疗愈食材、## 温暖步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表，注明疗愈功效\n6. 暖心话语用 **粗体** 标注\n7. 全文使用中文回复\n8. 多用 🌸💝🌟 等温暖 emoji\n9. 段落之间空一行，像写信一样温柔排版',
    squat:
      '你是一位精通"蹲门（穷游/省钱）"的生存厨师。请根据用户的描述，生成一份极度省钱、食材易得、操作简单的蹲门食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（接地气）\n3. 用 ## 分隔不同章节（如：## 省钱食材、## 快手步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表，注明价格/替代方案\n6. 省钱技巧用 **粗体** 标注\n7. 全文使用中文回复，语气接地气\n8. 多用 🏠💰🍜 等生活 emoji\n9. 段落之间空一行，清晰实用排版',
  };

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
    });
  });

  /* ── 主函数 ── */
  async function startCooking() {
    const input = document.getElementById('user-input').value.trim();
    if (!input) {
      showError('🧽 哎呀！请先告诉海绵宝宝你想吃什么嘛～');
      return;
    }

    const btn = document.getElementById('cook-btn');
    const loading = document.getElementById('loading');
    const resultSection = document.getElementById('result-section');
    const errorBox = document.getElementById('error-box');

    // 重置
    btn.disabled = true;
    btn.textContent = '🍳 正在烹饪中...';
    loading.style.display = 'block';
    resultSection.style.display = 'none';
    errorBox.style.display = 'none';

    const systemPrompt = modePrompts[currentMode];
    const userMessage = `请根据以下描述生成食谱：\n\n${input}`;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: 'stepfun/step-3.5-flash:free',
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user',   content: userMessage  },
          ],
          temperature: 0.9,
          max_tokens: 1800,
          stream: true,
        }),
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API 错误 ${response.status}: ${errText}`);
      }

      // 流式输出
      loading.style.display = 'none';
      resultSection.style.display = 'block';
      document.getElementById('mode-badge').textContent = modeLabels[currentMode];

      const outputEl = document.getElementById('recipe-output');
      outputEl.textContent = '';

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop(); // 保留不完整行

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed === 'data: [DONE]') continue;
          if (!trimmed.startsWith('data: ')) continue;
          try {
            const json = JSON.parse(trimmed.slice(6));
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              outputEl.textContent += delta;
              // 简单 markdown 渲染
              renderMarkdown(outputEl);
            }
          } catch (_) { /* 忽略解析错误 */ }
        }
      }

      // 最终渲染
      renderMarkdown(outputEl);

      // 滚动到结果
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      loading.style.display = 'none';
      showError(`😱 哎呀，厨房着火了！${err.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="btn-shine"></span>🍔 再来一道！继续烹饪！';
    }
  }

  /* ── Marked.js Markdown 渲染 ── */
  // 配置 marked
  marked.setOptions({
    gfm: true,
    breaks: true,
    headerIds: false,
    langPrefix: 'language-'
  });

  // 自定义渲染器
  const renderer = new marked.Renderer();

  // 自定义标题
  renderer.heading = (text, level) => {
    const className = level === 1 ? 'recipe-main-title' :
                      level === 2 ? 'recipe-section' : 'recipe-title';
    return `<h${level} class="${className}">${text}</h${level}>`;
  };

  // 自定义列表
  renderer.list = (body, ordered) => {
    const className = ordered ? 'recipe-list numbered' : 'recipe-list';
    const tag = ordered ? 'ol' : 'ul';
    return `<${tag} class="${className}">${body}</${tag}>`;
  };

  // 自定义列表项
  renderer.listitem = (text) => {
    return `<li class="recipe-item">${text}</li>`;
  };

  // 自定义段落
  renderer.paragraph = (text) => {
    return `<p class="recipe-paragraph">${text}</p>`;
  };

  // 自定义粗体
  renderer.strong = (text) => {
    return `<strong class="highlight">${text}</strong>`;
  };

  // 自定义代码块
  renderer.code = ({ code }, language) => {
    return `<pre class="recipe-code"><code class="language-${language || ''}">${code}</code></pre>`;
  };

  // 自定义行内代码
  renderer.codespan = (code) => {
    return `<code class="recipe-inline-code">${code}</code>`;
  };

  // 自定义分割线
  renderer.hr = () => {
    return `<hr class="recipe-divider">`;
  };

  // 使用自定义渲染器
  marked.use({ renderer });

  // 渲染函数
  function renderMarkdown(el) {
    const text = el.textContent;
    if (!text) return;

    try {
      // 使用 marked 解析 - 尝试同步模式
      let html;
      const result = marked.parse(text);
      
      // 处理不同版本的返回值
      if (typeof result === 'string') {
        html = result;
      } else if (result && typeof result === 'object') {
        // 可能是 Promise 或带有 html 属性的对象
        if (result.html) {
          html = result.html;
        } else if (result.then) {
          // 是 Promise，需要处理
          result.then(h => {
            el.innerHTML = typeof h === 'string' ? h : (h.html || String(h));
          });
          return;
        } else {
          html = String(result);
        }
      } else {
        html = String(result);
      }
      
      el.innerHTML = html;
    } catch (e) {
      console.error('Render error:', e);
      // 出错时直接显示原文本
      el.innerHTML = '<pre>' + text.replace(/</g, '&lt;') + '</pre>';
    }
  }

  /* ── 错误显示 ── */
  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
  }

  /* ── 回车快捷键 ── */
  document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) startCooking();
  });
</script>
</body>
</html>
