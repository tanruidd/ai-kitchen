<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍔 美味创意AI厨房 | 比奇堡蟹堡王特供</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./modes.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

    :root {
      --yellow:   #FFD700;
      --orange:   #FF8C00;
      --coral:    #FF6B6B;
      --teal:     #00CED1;
      --sky:      #87CEEB;
      --sand:     #F5DEB3;
      --cream:    #FFFDE7;
      --brown:    #8B4513;
      --green:    #3CB371;
      --bubble:   rgba(255,255,255,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #87CEEB 0%, #00CED1 40%, #F5DEB3 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── 气泡背景 ── */
    .bubbles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: var(--bubble);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(110vh) scale(1);   opacity: .6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0;  }
    }

    /* ── 主容器 ── */
    .container {
      position: relative; z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 32px 100px;
    }

    /* ── 头部 ── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-wrap {
      display: inline-block;
      background: var(--yellow);
      border-radius: 50%;
      width: 100px; height: 100px;
      line-height: 100px;
      font-size: 58px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.1);
      animation: bounce 2.4s ease-in-out infinite;
      margin-bottom: 14px;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0);    }
      50%      { transform: translateY(-10px); }
    }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0 var(--orange), 5px 5px 0 rgba(0,0,0,.15);
      letter-spacing: 1px;
    }
    .subtitle {
      margin-top: 8px;
      font-size: .95rem;
      color: rgba(255,255,255,.9);
      font-weight: 600;
      line-height: 1.5;
    }

    /* ── 卡片 ── */
    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 36px 36px 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
      margin-bottom: 32px;
    }

    /* ── 标签 ── */
    .label {
      font-size: .88rem;
      font-weight: 800;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── 输入框 ── */
    textarea {
      width: 100%;
      min-height: 120px;
      border: 2.5px solid var(--yellow);
      border-radius: 16px;
      padding: 16px 18px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      background: var(--cream);
      resize: vertical;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      line-height: 1.6;
    }
    textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255,140,0,.18);
    }
    textarea::placeholder { color: #bbb; font-weight: 400; line-height: 1.6; }

    /* ── 模式选择 ── */
    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 6px;
    }
    .mode-btn {
      flex: 1 1 calc(20% - 14px);
      min-width: 100px;
      padding: 14px 12px;
      border: 2.5px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 800;
      text-align: center;
      transition: all .2s;
      background: #f5f5f5;
      color: #555;
      user-select: none;
      line-height: 1.4;
    }
    .mode-btn .mode-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
    .mode-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.12); }

    .mode-btn.active[data-mode="normal"]   { background: #FFF9C4; border-color: #FFD700; color: #7a5c00; }
    .mode-btn.active[data-mode="michelin"] { background: #FCE4EC; border-color: #E91E63; color: #880E4F; }
    .mode-btn.active[data-mode="dark"]     { background: #EDE7F6; border-color: #673AB7; color: #311B92; }
    .mode-btn.active[data-mode="healing"]  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .mode-btn.active[data-mode="squat"]    { background: #E3F2FD; border-color: #2196F3; color: #0D47A1; }
    .mode-btn.active[data-mode="street"]   { background: #FFF3E0; border-color: #FF9800; color: #E65100; }

    /* ── 按钮 ── */
    .cook-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--coral) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: .5px;
      box-shadow: 0 6px 20px rgba(255,107,107,.4);
      transition: all .2s;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .cook-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255,107,107,.5);
    }
    .cook-btn:active:not(:disabled) { transform: translateY(1px); }
    .cook-btn:disabled { opacity: .7; cursor: not-allowed; }
    .cook-btn .btn-shine {
      position: absolute; top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      animation: shine 2.5s ease-in-out infinite;
    }
    @keyframes shine {
      0%   { left: -100%; }
      50%  { left: 150%;  }
      100% { left: 150%;  }
    }

    /* ── 结果区 ── */
    #result-section { display: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .result-header h2 {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--brown);
    }
    .mode-badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 800;
      background: var(--yellow);
      color: var(--brown);
    }

    /* ── 操作按钮 ── */
    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-btns {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .action-btn {
      padding: 5px 14px;
      border: 2px solid var(--yellow);
      border-radius: 20px;
      background: #FFFDE7;
      color: var(--brown);
      font-family: inherit;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      user-select: none;
    }
    .action-btn:hover {
      background: var(--yellow);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255,215,0,.35);
    }
    .action-btn:active {
      transform: translateY(0);
    }
    .action-btn.copied {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    /* ── 图片预览弹窗 ── */
    .preview-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      z-index: 9998;
      align-items: center;
      justify-content: center;
    }
    .preview-modal.open {
      display: flex;
    }
    .preview-modal-inner {
      background: #fff;
      border-radius: 24px;
      padding: 28px 28px 24px;
      max-width: 440px;
      width: 92%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.25);
    }
    .preview-modal-inner h3 {
      font-size: 1.15rem;
      color: var(--brown);
      margin-bottom: 14px;
      font-weight: 800;
    }
    .preview-img-wrap {
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 6px 24px rgba(0,0,0,.15);
      margin-bottom: 18px;
      display: inline-block;
      max-width: 100%;
    }
    .preview-img-wrap img {
      display: block;
      max-width: 100%;
      max-height: 420px;
      width: auto;
      height: auto;
    }
    .preview-actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }
    .preview-download-btn {
      flex: 1;
      padding: 13px 20px;
      background: linear-gradient(135deg, var(--orange), var(--coral));
      color: #fff;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: .95rem;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 4px 16px rgba(255,107,107,.35);
    }
    .preview-download-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(255,107,107,.45);
    }
    .preview-cancel-btn {
      flex: 0 0 auto;
      padding: 13px 20px;
      background: #f5f5f5;
      color: #666;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .preview-cancel-btn:hover {
      background: #e8e8e8;
    }
    .preview-save-btn {
      flex: 1;
      padding: 13px 20px;
      background: var(--green);
      color: #fff;
      border: none;
      border-radius: 16px;
      font-family: inherit;
      font-size: .9rem;
      font-weight: 800;
      cursor: pointer;
      transition: all .2s;
      box-shadow: 0 4px 12px rgba(60,179,113,.35);
    }
    .preview-save-btn:hover {
      background: #2e9e4b;
      transform: translateY(-1px);
    }

    /* ── Toast 提示 ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(51,51,51,.92);
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: .92rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s;
      opacity: 0;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }



    /* ── 分享卡片（截图用） ── */
    .share-card {
      position: fixed;
      left: -9999px;
      top: 0;
      width: 680px;
      padding: 48px 52px 40px;
      background: linear-gradient(160deg, #87CEEB 0%, #00CED1 40%, #F5DEB3 100%);
      font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      color: #333;
      line-height: 1.9;
    }
    .share-card-header {
      display: flex;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
    }
    .share-card-logo {
      width: 72px;
      height: 72px;
      background: #FFD700;
      border-radius: 50%;
      font-size: 40px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 12px rgba(0,0,0,.15);
      flex-shrink: 0;
    }
    .share-card-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #fff;
      text-shadow: 2px 2px 0 rgba(0,0,0,.2);
    }
    .share-card-subtitle {
      font-size: .9rem;
      color: rgba(255,255,255,.85);
      font-weight: 600;
      margin-top: 4px;
    }
    .share-card-mode {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(255,255,255,.3);
      border-radius: 20px;
      font-size: .78rem;
      font-weight: 700;
      color: #fff;
      margin-top: 6px;
    }
    .share-card-divider {
      width: 60px;
      height: 4px;
      background: #FFD700;
      border-radius: 2px;
      margin-bottom: 24px;
    }
    .share-card-recipe {
      background: rgba(255,255,255,.92);
      border-radius: 20px;
      padding: 28px 32px;
      font-size: .95rem;
      line-height: 1.85;
    }
    .share-card-recipe h1 {
      color: #8B4513;
      font-size: 1.4rem;
      font-weight: 900;
      margin: 0 0 16px 0;
      padding-bottom: 12px;
      border-bottom: 2px solid #FFD700;
    }
    .share-card-recipe h2 {
      color: #FF8C00;
      font-size: 1.1rem;
      font-weight: 800;
      margin: 20px 0 10px 0;
      padding-left: 10px;
      border-left: 3px solid #FF8C00;
    }
    .share-card-recipe p { margin: 0 0 12px 0; }
    .share-card-recipe ul,
    .share-card-recipe ol { padding-left: 22px; margin: 8px 0 16px 0; }
    .share-card-recipe li { margin-bottom: 6px; }
    .share-card-recipe strong { color: #FF8C00; font-weight: 700; }
    .share-card-recipe code {
      background: #f5f5f5;
      padding: 1px 5px;
      border-radius: 3px;
      font-size: .88em;
      color: #FF6B6B;
    }
    .share-card-recipe pre {
      background: #f8f8f8;
      padding: 12px;
      border-radius: 10px;
      overflow-x: auto;
    }
    .share-card-footer {
      margin-top: 20px;
      text-align: center;
      font-size: .82rem;
      color: rgba(255,255,255,.75);
      font-weight: 600;
    }

    /* ── Markdown 渲染结果样式 ── */
    #recipe-output {
      line-height: 1.9;
      color: #333;
      font-size: 1rem;
    }
    #recipe-output h1 {
      color: var(--brown);
      font-size: 1.55rem;
      font-weight: 900;
      margin: 0 0 20px 0;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--yellow);
      line-height: 1.3;
    }
    #recipe-output h2 {
      color: var(--orange);
      font-size: 1.2rem;
      font-weight: 800;
      margin: 28px 0 14px 0;
      padding-left: 12px;
      border-left: 4px solid var(--orange);
      line-height: 1.4;
    }
    #recipe-output h3 {
      color: var(--brown);
      font-size: 1.05rem;
      font-weight: 700;
      margin: 18px 0 10px 0;
    }
    #recipe-output p {
      margin: 0 0 14px 0;
      line-height: 1.9;
    }
    #recipe-output ul,
    #recipe-output ol {
      padding-left: 26px;
      margin: 10px 0 20px 0;
    }
    #recipe-output li {
      margin-bottom: 8px;
      line-height: 1.7;
    }
    #recipe-output strong {
      color: var(--orange);
      font-weight: 700;
    }
    #recipe-output em {
      color: #666;
    }
    #recipe-output hr {
      border: none;
      border-top: 2px dashed var(--yellow);
      margin: 24px 0;
    }
    #recipe-output code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.88em;
      color: var(--coral);
    }
    #recipe-output pre {
      background: #f8f8f8;
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 16px 0;
    }
    #recipe-output pre code {
      background: none;
      padding: 0;
      color: #333;
    }
    #recipe-output blockquote {
      border-left: 4px solid var(--teal);
      padding-left: 16px;
      margin: 16px 0;
      color: #555;
      background: rgba(0,206,209,0.06);
      border-radius: 0 8px 8px 0;
      padding: 10px 16px;
    }

    /* ── 加载动画 ── */
    .loading-wrap {
      text-align: center;
      padding: 36px 0;
      display: none;
    }
    .pan {
      font-size: 3.2rem;
      display: inline-block;
      animation: fry .6s ease-in-out infinite alternate;
    }
    @keyframes fry {
      0%   { transform: rotate(-12deg) translateY(0);  }
      100% { transform: rotate(12deg)  translateY(-8px); }
    }
    .loading-text {
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--brown);
      line-height: 1.5;
    }
    .dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: '';    }
      25%  { content: '.';   }
      50%  { content: '..';  }
      75%  { content: '...'; }
      100% { content: '';    }
    }

    /* ── 错误提示 ── */
    .error-box {
      background: #FFF3F3;
      border: 2px solid var(--coral);
      border-radius: 16px;
      padding: 16px 20px;
      color: #c0392b;
      font-weight: 700;
      display: none;
      margin-top: 16px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* ── 底部 ── */
    footer {
      text-align: center;
      color: rgba(255,255,255,.8);
      font-size: .85rem;
      font-weight: 600;
      margin-top: 12px;
      line-height: 1.6;
    }

    /* ── 响应式 ── */
    @media (max-width: 580px) {
      .container {
        padding: 40px 20px 80px;
      }
      .card {
        padding: 28px 24px 32px;
        margin-bottom: 24px;
      }
      .logo-wrap {
        width: 88px;
        height: 88px;
        line-height: 88px;
        font-size: 50px;
      }
      header {
        margin-bottom: 36px;
      }
      .mode-btn {
        flex: 1 1 calc(50% - 14px);
        padding: 14px 12px;
      }
      .modes {
        gap: 14px;
      }
      .label {
        margin-bottom: 14px;
        font-size: .85rem;
      }
      #result-header h2 {
        font-size: 1.2rem;
      }
      #recipe-output {
        font-size: .95rem;
        line-height: 1.9;
      }
      .cook-btn {
        padding: 18px;
        margin-bottom: 24px;
      }
    }

    @media (max-width: 380px) {
      .mode-btn {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

<!-- 气泡背景 -->
<div class="bubbles" id="bubbles"></div>

<div class="container">

  <!-- 头部 -->
  <header>
    <div class="logo-wrap">🧽</div>
    <h1>美味创意 AI 厨房</h1>
    <p class="subtitle">🦀 蟹老板御用 · 比奇堡最强食谱生成器 · 海绵宝宝亲自研发 🍔</p>
  </header>

  <!-- 输入卡片 -->
  <div class="card">
    <div class="label">🍽️ 告诉我你想吃什么 / 你的心情</div>
    <textarea
      id="user-input"
      placeholder="例如：我今天很累，想吃一碗暖暖的汤面 🍜&#10;或者：帮我做一道能让朋友惊艳的派对菜 🎉&#10;或者：我只有鸡蛋和番茄，能做什么？ 🍅"
    ></textarea>
  </div>

  <!-- 模式卡片 -->
  <div class="card">
    <div class="label">🔥 选择烹饪模式</div>
    <div class="modes">
      <button class="mode-btn active" data-mode="normal">
        <span class="mode-icon">🍳</span>普通模式
      </button>
      <button class="mode-btn" data-mode="michelin">
        <span class="mode-icon">⭐</span>米其林
      </button>
      <button class="mode-btn" data-mode="dark">
        <span class="mode-icon">💀</span>暗黑料理
      </button>
      <button class="mode-btn" data-mode="healing">
        <span class="mode-icon">🌸</span>治愈系
      </button>
      <button class="mode-btn" data-mode="squat">
        <span class="mode-icon">🏠</span>蹲门模式
      </button>
      <button class="mode-btn" data-mode="street">
        <span class="mode-icon">🏮</span>摆摊小吃
      </button>
    </div>
  </div>

  <!-- 按钮 -->
  <button class="cook-btn" id="cook-btn" onclick="startCooking()">
    <span class="btn-shine"></span>
    🍔 开始烹饪！让海绵宝宝大显身手！
  </button>

  <!-- 加载 -->
  <div class="loading-wrap" id="loading">
    <div class="pan">🍳</div>
    <div class="loading-text">海绵宝宝正在厨房疯狂烹饪<span class="dots"></span></div>
  </div>

  <!-- 错误 -->
  <div class="error-box" id="error-box"></div>

  <!-- 结果卡片 -->
  <div class="card" id="result-section">
    <div class="result-header">
      <h2>🎉 食谱出炉啦！</h2>
      <span class="mode-badge" id="mode-badge"></span>
      <div class="action-btns" id="action-btns" style="display:none;">
        <button class="action-btn" id="copy-btn" onclick="copyRecipe()" title="复制食谱">
          📋 复制
        </button>
        <button class="action-btn" id="share-btn" onclick="shareRecipe()" title="分享食谱">
          🖼️ 分享图片
        </button>
      </div>
    </div>
    <div id="recipe-output"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 图片预览弹窗 -->
  <div class="preview-modal" id="preview-modal">
    <div class="preview-modal-inner">
      <h3>🖼️ 食谱图片预览</h3>
      <div class="preview-img-wrap">
        <img id="preview-img" src="" alt="食谱预览" />
      </div>
      <div class="preview-actions">
        <button class="preview-download-btn" id="preview-download-btn">
          💾 保存图片
        </button>
        <button class="preview-cancel-btn" onclick="closePreviewModal()">
          取消
        </button>
      </div>
    </div>
  </div>

  <!-- 分享卡片（截图用，隐藏在视口外） -->
  <div class="share-card" id="share-card">
    <div class="share-card-header">
      <div class="share-card-logo">🧽</div>
      <div>
        <div class="share-card-title">美味创意 AI 厨房</div>
        <div class="share-card-subtitle">🦀 比奇堡蟹堡王特供 · AI 生成食谱</div>
        <div class="share-card-mode" id="share-card-mode">🍳 普通模式</div>
      </div>
    </div>
    <div class="share-card-divider"></div>
    <div class="share-card-recipe" id="share-card-recipe"></div>
    <div class="share-card-footer">🍔 由美味创意 AI 厨房生成 · 每一道菜都是爱 ❤️</div>
  </div>

  <footer>
    🧽 由海绵宝宝 × 蟹老板联合出品 · 比奇堡 AI 厨房 · 每一道菜都是爱 ❤️
  </footer>

</div>

<script>
  /* ── 气泡生成 ── */
  (function spawnBubbles() {
    const wrap = document.getElementById('bubbles');
    for (let i = 0; i < 22; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 18 + Math.random() * 60;
      b.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        animation-duration:${6+Math.random()*10}s;
        animation-delay:${-Math.random()*12}s;
        opacity:${0.2+Math.random()*0.4};
      `;
      wrap.appendChild(b);
    }
  })();

  /* ── 模式选择 ── */
  let currentMode = 'normal';

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
    });
  });

  /* ── 主函数 ── */
  async function startCooking() {
    const input = document.getElementById('user-input').value.trim();
    if (!input) {
      showError('🧽 哎呀！请先告诉海绵宝宝你想吃什么嘛～');
      return;
    }

    const btn = document.getElementById('cook-btn');
    const loading = document.getElementById('loading');
    const resultSection = document.getElementById('result-section');
    const errorBox = document.getElementById('error-box');

    // 重置
    btn.disabled = true;
    btn.textContent = '🍳 正在烹饪中...';
    loading.style.display = 'block';
    resultSection.style.display = 'none';
    errorBox.style.display = 'none';
    document.getElementById('action-btns').style.display = 'none';

    const systemPrompt = window.MODE_PROMPTS[currentMode];
    const userMessage = `请根据以下描述生成食谱：\n\n${input}`;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: 'stepfun/step-3.5-flash:free',
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user',   content: userMessage  },
          ],
          temperature: 0.9,
          max_tokens: 1800,
          stream: true,
        }),
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API 错误 ${response.status}: ${errText}`);
      }

      // 流式输出
      loading.style.display = 'none';
      resultSection.style.display = 'block';
      document.getElementById('mode-badge').textContent = window.MODE_LABELS[currentMode];

      const outputEl = document.getElementById('recipe-output');
      outputEl.innerHTML = '';

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let fullText = '';
      let lastRenderTime = 0;

      const renderInterval = 120; // 每 120ms 最多渲染一次，防抖

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed === 'data: [DONE]') continue;
          if (!trimmed.startsWith('data: ')) continue;
          try {
            const json = JSON.parse(trimmed.slice(6));
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullText += delta;
              const now = Date.now();
              if (now - lastRenderTime >= renderInterval) {
                lastRenderTime = now;
                outputEl.innerHTML = marked.parse(fullText);
              }
            }
          } catch (_) { /* 忽略解析错误 */ }
        }
      }

      // 最后完整渲染一次
      outputEl.innerHTML = marked.parse(fullText);

      // 显示操作按钮
      document.getElementById('action-btns').style.display = 'flex';

      // 滚动到结果
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      loading.style.display = 'none';
      showError(`😱 哎呀，厨房着火了！${err.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="btn-shine"></span>🍔 再来一道！继续烹饪！';
    }
  }

  // ── Markdown 渲染 ──
  function renderMarkdown(el) {
    const raw = el.textContent || '';
    // 配置 marked 选项
    marked.setOptions({
      breaks: true,       // 换行变 <br>
      gfm: true,          // GitHub Flavored Markdown
    });
    el.innerHTML = marked.parse(raw);
  }

  /* ── Toast 提示 ── */
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /* ── 复制食谱 ── */
  function copyRecipe() {
    const text = document.getElementById('recipe-output').textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✅ 已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 复制';
        btn.classList.remove('copied');
      }, 2000);
      showToast('📋 食谱已复制到剪贴板！');
    }).catch(() => {
      showToast('复制失败，请手动选择复制~');
    });
  }

  /* ── 图片分享食谱 ── */
  async function shareRecipe() {
    const outputEl = document.getElementById('recipe-output');
    if (!outputEl.textContent) return;

    const modeText = document.getElementById('mode-badge').textContent;

    // 1. 把当前食谱内容复制到分享卡片
    document.getElementById('share-card-mode').textContent = modeText;
    document.getElementById('share-card-recipe').innerHTML = outputEl.innerHTML;

    // 2. 显示卡片（移出视口外）
    const card = document.getElementById('share-card');
    card.style.left = '0';

    try {
      // 3. 用 html2canvas 截图
      const canvas = await html2canvas(card, {
        scale: 2,
        useCORS: true,
        backgroundColor: null,
        logging: false,
      });

      // 4. 生成 dataURL 显示预览
      const dataUrl = canvas.toDataURL('image/png');
      const previewImg = document.getElementById('preview-img');
      previewImg.src = dataUrl;

      // 5. 下载按钮绑定
      const downloadBtn = document.getElementById('preview-download-btn');
      downloadBtn.onclick = () => {
        const a = document.createElement('a');
        a.href = dataUrl;
        a.download = `AI食谱-${modeText.replace(/[^a-zA-Z\u4e00-\u9fa5]/g, '').trim()}.png`;
        a.click();
        closePreviewModal();
        showToast('🖼️ 图片已保存！');
      };

      // 6. 显示预览弹窗
      document.getElementById('preview-modal').classList.add('open');

    } catch(e) {
      console.error('截图失败:', e);
      showToast('截图失败，请稍后重试~');
    } finally {
      // 隐藏卡片
      card.style.left = '-9999px';
    }
  }

  /* ── 关闭预览弹窗 ── */
  function closePreviewModal() {
    document.getElementById('preview-modal').classList.remove('open');
  }

  // 点击背景关闭
  document.getElementById('preview-modal').addEventListener('click', e => {
    if (e.target.id === 'preview-modal') closePreviewModal();
  });

  /* ── 分享链接（URL快照模式，已废弃，改用图片）── */

  /* ── 错误显示 ── */
  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
  }

  /* ── 回车快捷键 ── */
  document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) startCooking();
  });

  /* ── 页面加载时检查分享链接 ── */
  window.addEventListener('DOMContentLoaded', () => {
    // 预留：后续可从 URL 恢复分享内容
  });
</script>
</body>
</html>
