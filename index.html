<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍔 美味创意AI厨房 | 比奇堡蟹堡王特供</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap');

    :root {
      --yellow:   #FFD700;
      --orange:   #FF8C00;
      --coral:    #FF6B6B;
      --teal:     #00CED1;
      --sky:      #87CEEB;
      --sand:     #F5DEB3;
      --cream:    #FFFDE7;
      --brown:    #8B4513;
      --green:    #3CB371;
      --bubble:   rgba(255,255,255,0.35);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      background: linear-gradient(160deg, #87CEEB 0%, #00CED1 40%, #F5DEB3 100%);
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* ── 气泡背景 ── */
    .bubbles {
      position: fixed; inset: 0; pointer-events: none; z-index: 0;
      overflow: hidden;
    }
    .bubble {
      position: absolute;
      border-radius: 50%;
      background: var(--bubble);
      animation: rise linear infinite;
    }
    @keyframes rise {
      0%   { transform: translateY(110vh) scale(1);   opacity: .6; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0;  }
    }

    /* ── 主容器 ── */
    .container {
      position: relative; z-index: 1;
      max-width: 720px;
      margin: 0 auto;
      padding: 60px 32px 100px;
    }

    /* ── 头部 ── */
    header {
      text-align: center;
      margin-bottom: 48px;
    }
    .logo-wrap {
      display: inline-block;
      background: var(--yellow);
      border-radius: 50%;
      width: 100px; height: 100px;
      line-height: 100px;
      font-size: 58px;
      box-shadow: 0 8px 24px rgba(0,0,0,.18), inset 0 -4px 0 rgba(0,0,0,.1);
      animation: bounce 2.4s ease-in-out infinite;
      margin-bottom: 14px;
    }
    @keyframes bounce {
      0%,100% { transform: translateY(0);    }
      50%      { transform: translateY(-10px); }
    }
    h1 {
      font-size: clamp(1.6rem, 5vw, 2.4rem);
      font-weight: 900;
      color: #fff;
      text-shadow: 3px 3px 0 var(--orange), 5px 5px 0 rgba(0,0,0,.15);
      letter-spacing: 1px;
    }
    .subtitle {
      margin-top: 8px;
      font-size: .95rem;
      color: rgba(255,255,255,.9);
      font-weight: 600;
      line-height: 1.5;
    }

    /* ── 卡片 ── */
    .card {
      background: rgba(255,255,255,.88);
      backdrop-filter: blur(12px);
      border-radius: 24px;
      padding: 36px 36px 40px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
      margin-bottom: 32px;
    }

    /* ── 标签 ── */
    .label {
      font-size: .88rem;
      font-weight: 800;
      color: var(--brown);
      text-transform: uppercase;
      letter-spacing: .8px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* ── 输入框 ── */
    textarea {
      width: 100%;
      min-height: 120px;
      border: 2.5px solid var(--yellow);
      border-radius: 16px;
      padding: 16px 18px;
      font-family: inherit;
      font-size: 1rem;
      font-weight: 600;
      color: #333;
      background: var(--cream);
      resize: vertical;
      outline: none;
      transition: border-color .2s, box-shadow .2s;
      line-height: 1.6;
    }
    textarea:focus {
      border-color: var(--orange);
      box-shadow: 0 0 0 4px rgba(255,140,0,.18);
    }
    textarea::placeholder { color: #bbb; font-weight: 400; line-height: 1.6; }

    /* ── 模式选择 ── */
    .modes {
      display: flex;
      flex-wrap: wrap;
      gap: 14px;
      margin-top: 6px;
    }
    .mode-btn {
      flex: 1 1 calc(20% - 14px);
      min-width: 100px;
      padding: 14px 12px;
      border: 2.5px solid transparent;
      border-radius: 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 800;
      text-align: center;
      transition: all .2s;
      background: #f5f5f5;
      color: #555;
      user-select: none;
      line-height: 1.4;
    }
    .mode-btn .mode-icon { font-size: 1.6rem; display: block; margin-bottom: 6px; }
    .mode-btn:hover { transform: translateY(-3px); box-shadow: 0 6px 16px rgba(0,0,0,.12); }

    .mode-btn.active[data-mode="normal"]   { background: #FFF9C4; border-color: #FFD700; color: #7a5c00; }
    .mode-btn.active[data-mode="michelin"] { background: #FCE4EC; border-color: #E91E63; color: #880E4F; }
    .mode-btn.active[data-mode="dark"]     { background: #EDE7F6; border-color: #673AB7; color: #311B92; }
    .mode-btn.active[data-mode="healing"]  { background: #E8F5E9; border-color: #4CAF50; color: #1B5E20; }
    .mode-btn.active[data-mode="squat"]    { background: #E3F2FD; border-color: #2196F3; color: #0D47A1; }

    /* ── 按钮 ── */
    .cook-btn {
      width: 100%;
      padding: 18px;
      border: none;
      border-radius: 20px;
      background: linear-gradient(135deg, var(--orange) 0%, var(--coral) 100%);
      color: #fff;
      font-family: inherit;
      font-size: 1.15rem;
      font-weight: 900;
      cursor: pointer;
      letter-spacing: .5px;
      box-shadow: 0 6px 20px rgba(255,107,107,.4);
      transition: all .2s;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
    }
    .cook-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 10px 28px rgba(255,107,107,.5);
    }
    .cook-btn:active:not(:disabled) { transform: translateY(1px); }
    .cook-btn:disabled { opacity: .7; cursor: not-allowed; }
    .cook-btn .btn-shine {
      position: absolute; top: 0; left: -100%;
      width: 60%; height: 100%;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.3), transparent);
      animation: shine 2.5s ease-in-out infinite;
    }
    @keyframes shine {
      0%   { left: -100%; }
      50%  { left: 150%;  }
      100% { left: 150%;  }
    }

    /* ── 结果区 ── */
    #result-section { display: none; }

    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }
    .result-header h2 {
      font-size: 1.35rem;
      font-weight: 900;
      color: var(--brown);
    }
    .mode-badge {
      padding: 5px 14px;
      border-radius: 20px;
      font-size: .8rem;
      font-weight: 800;
      background: var(--yellow);
      color: var(--brown);
    }

    /* ── 操作按钮 ── */
    .result-header {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .action-btns {
      display: flex;
      gap: 8px;
      margin-left: auto;
    }
    .action-btn {
      padding: 5px 14px;
      border: 2px solid var(--yellow);
      border-radius: 20px;
      background: #FFFDE7;
      color: var(--brown);
      font-family: inherit;
      font-size: .82rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
      user-select: none;
    }
    .action-btn:hover {
      background: var(--yellow);
      transform: translateY(-1px);
      box-shadow: 0 4px 12px rgba(255,215,0,.35);
    }
    .action-btn:active {
      transform: translateY(0);
    }
    .action-btn.copied {
      background: var(--green);
      border-color: var(--green);
      color: #fff;
    }

    /* ── Toast 提示 ── */
    .toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: rgba(51,51,51,.92);
      color: #fff;
      padding: 12px 24px;
      border-radius: 40px;
      font-size: .92rem;
      font-weight: 700;
      box-shadow: 0 8px 24px rgba(0,0,0,.25);
      transition: transform .35s cubic-bezier(.4,0,.2,1), opacity .35s;
      opacity: 0;
      z-index: 9999;
      pointer-events: none;
      white-space: nowrap;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* ── 分享弹窗 ── */
    .share-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.5);
      z-index: 9998;
      align-items: center;
      justify-content: center;
    }
    .share-modal.open {
      display: flex;
    }
    .share-modal-inner {
      background: #fff;
      border-radius: 24px;
      padding: 32px 28px 28px;
      max-width: 420px;
      width: 90%;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,.2);
    }
    .share-modal-inner h3 {
      font-size: 1.2rem;
      color: var(--brown);
      margin-bottom: 16px;
    }
    .share-link-wrap {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }
    .share-link-input {
      flex: 1;
      padding: 10px 14px;
      border: 2px solid var(--yellow);
      border-radius: 12px;
      font-size: .85rem;
      font-family: inherit;
      color: #333;
      outline: none;
    }
    .share-copy-btn {
      padding: 10px 18px;
      background: var(--orange);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-family: inherit;
      font-size: .88rem;
      font-weight: 700;
      cursor: pointer;
      transition: all .2s;
    }
    .share-copy-btn:hover {
      background: var(--coral);
    }
    .share-wechat-note {
      font-size: .82rem;
      color: #888;
      line-height: 1.5;
    }
    .share-close-btn {
      margin-top: 16px;
      padding: 8px 20px;
      background: #f5f5f5;
      color: #666;
      border: none;
      border-radius: 20px;
      font-family: inherit;
      font-size: .85rem;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Markdown 渲染结果样式 ── */
    #recipe-output {
      line-height: 1.9;
      color: #333;
      font-size: 1rem;
    }
    #recipe-output h1 {
      color: var(--brown);
      font-size: 1.55rem;
      font-weight: 900;
      margin: 0 0 20px 0;
      padding-bottom: 12px;
      border-bottom: 3px solid var(--yellow);
      line-height: 1.3;
    }
    #recipe-output h2 {
      color: var(--orange);
      font-size: 1.2rem;
      font-weight: 800;
      margin: 28px 0 14px 0;
      padding-left: 12px;
      border-left: 4px solid var(--orange);
      line-height: 1.4;
    }
    #recipe-output h3 {
      color: var(--brown);
      font-size: 1.05rem;
      font-weight: 700;
      margin: 18px 0 10px 0;
    }
    #recipe-output p {
      margin: 0 0 14px 0;
      line-height: 1.9;
    }
    #recipe-output ul,
    #recipe-output ol {
      padding-left: 26px;
      margin: 10px 0 20px 0;
    }
    #recipe-output li {
      margin-bottom: 8px;
      line-height: 1.7;
    }
    #recipe-output strong {
      color: var(--orange);
      font-weight: 700;
    }
    #recipe-output em {
      color: #666;
    }
    #recipe-output hr {
      border: none;
      border-top: 2px dashed var(--yellow);
      margin: 24px 0;
    }
    #recipe-output code {
      background: #f5f5f5;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'Monaco', 'Consolas', monospace;
      font-size: 0.88em;
      color: var(--coral);
    }
    #recipe-output pre {
      background: #f8f8f8;
      padding: 16px;
      border-radius: 12px;
      overflow-x: auto;
      margin: 16px 0;
    }
    #recipe-output pre code {
      background: none;
      padding: 0;
      color: #333;
    }
    #recipe-output blockquote {
      border-left: 4px solid var(--teal);
      padding-left: 16px;
      margin: 16px 0;
      color: #555;
      background: rgba(0,206,209,0.06);
      border-radius: 0 8px 8px 0;
      padding: 10px 16px;
    }

    /* ── 加载动画 ── */
    .loading-wrap {
      text-align: center;
      padding: 36px 0;
      display: none;
    }
    .pan {
      font-size: 3.2rem;
      display: inline-block;
      animation: fry .6s ease-in-out infinite alternate;
    }
    @keyframes fry {
      0%   { transform: rotate(-12deg) translateY(0);  }
      100% { transform: rotate(12deg)  translateY(-8px); }
    }
    .loading-text {
      margin-top: 14px;
      font-size: 1rem;
      font-weight: 700;
      color: var(--brown);
      line-height: 1.5;
    }
    .dots::after {
      content: '';
      animation: dots 1.2s steps(4, end) infinite;
    }
    @keyframes dots {
      0%   { content: '';    }
      25%  { content: '.';   }
      50%  { content: '..';  }
      75%  { content: '...'; }
      100% { content: '';    }
    }

    /* ── 错误提示 ── */
    .error-box {
      background: #FFF3F3;
      border: 2px solid var(--coral);
      border-radius: 16px;
      padding: 16px 20px;
      color: #c0392b;
      font-weight: 700;
      display: none;
      margin-top: 16px;
      margin-bottom: 12px;
      line-height: 1.5;
    }

    /* ── 底部 ── */
    footer {
      text-align: center;
      color: rgba(255,255,255,.8);
      font-size: .85rem;
      font-weight: 600;
      margin-top: 12px;
      line-height: 1.6;
    }

    /* ── 响应式 ── */
    @media (max-width: 580px) {
      .container {
        padding: 40px 20px 80px;
      }
      .card {
        padding: 28px 24px 32px;
        margin-bottom: 24px;
      }
      .logo-wrap {
        width: 88px;
        height: 88px;
        line-height: 88px;
        font-size: 50px;
      }
      header {
        margin-bottom: 36px;
      }
      .mode-btn {
        flex: 1 1 calc(50% - 14px);
        padding: 14px 12px;
      }
      .modes {
        gap: 14px;
      }
      .label {
        margin-bottom: 14px;
        font-size: .85rem;
      }
      #result-header h2 {
        font-size: 1.2rem;
      }
      #recipe-output {
        font-size: .95rem;
        line-height: 1.9;
      }
      .cook-btn {
        padding: 18px;
        margin-bottom: 24px;
      }
    }

    @media (max-width: 380px) {
      .mode-btn {
        flex: 1 1 100%;
      }
    }
  </style>
</head>
<body>

<!-- 气泡背景 -->
<div class="bubbles" id="bubbles"></div>

<div class="container">

  <!-- 头部 -->
  <header>
    <div class="logo-wrap">🧽</div>
    <h1>美味创意 AI 厨房</h1>
    <p class="subtitle">🦀 蟹老板御用 · 比奇堡最强食谱生成器 · 海绵宝宝亲自研发 🍔</p>
  </header>

  <!-- 输入卡片 -->
  <div class="card">
    <div class="label">🍽️ 告诉我你想吃什么 / 你的心情</div>
    <textarea
      id="user-input"
      placeholder="例如：我今天很累，想吃一碗暖暖的汤面 🍜&#10;或者：帮我做一道能让朋友惊艳的派对菜 🎉&#10;或者：我只有鸡蛋和番茄，能做什么？ 🍅"
    ></textarea>
  </div>

  <!-- 模式卡片 -->
  <div class="card">
    <div class="label">🔥 选择烹饪模式</div>
    <div class="modes">
      <button class="mode-btn active" data-mode="normal">
        <span class="mode-icon">🍳</span>普通模式
      </button>
      <button class="mode-btn" data-mode="michelin">
        <span class="mode-icon">⭐</span>米其林
      </button>
      <button class="mode-btn" data-mode="dark">
        <span class="mode-icon">💀</span>暗黑料理
      </button>
      <button class="mode-btn" data-mode="healing">
        <span class="mode-icon">🌸</span>治愈系
      </button>
      <button class="mode-btn" data-mode="squat">
        <span class="mode-icon">🏠</span>蹲门模式
      </button>
    </div>
  </div>

  <!-- 按钮 -->
  <button class="cook-btn" id="cook-btn" onclick="startCooking()">
    <span class="btn-shine"></span>
    🍔 开始烹饪！让海绵宝宝大显身手！
  </button>

  <!-- 加载 -->
  <div class="loading-wrap" id="loading">
    <div class="pan">🍳</div>
    <div class="loading-text">海绵宝宝正在厨房疯狂烹饪<span class="dots"></span></div>
  </div>

  <!-- 错误 -->
  <div class="error-box" id="error-box"></div>

  <!-- 结果卡片 -->
  <div class="card" id="result-section">
    <div class="result-header">
      <h2>🎉 食谱出炉啦！</h2>
      <span class="mode-badge" id="mode-badge"></span>
      <div class="action-btns" id="action-btns" style="display:none;">
        <button class="action-btn" id="copy-btn" onclick="copyRecipe()" title="复制食谱">
          📋 复制
        </button>
        <button class="action-btn" id="share-btn" onclick="shareRecipe()" title="分享食谱">
          🔗 分享
        </button>
      </div>
    </div>
    <div id="recipe-output"></div>
  </div>

  <!-- 分享弹窗 -->
  <div class="share-modal" id="share-modal">
    <div class="share-modal-inner">
      <h3>🔗 分享这份食谱</h3>
      <div class="share-link-wrap">
        <input class="share-link-input" id="share-link-input" type="text" readonly />
        <button class="share-copy-btn" onclick="copyShareLink()">复制</button>
      </div>
      <p class="share-wechat-note">
        复制链接后，打开微信粘贴发送给朋友～<br/>
        或者长按复制食谱文字直接分享 👌
      </p>
      <button class="share-close-btn" onclick="closeShareModal()">关闭</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <footer>
    🧽 由海绵宝宝 × 蟹老板联合出品 · 比奇堡 AI 厨房 · 每一道菜都是爱 ❤️
  </footer>

</div>

<script>
  /* ── 气泡生成 ── */
  (function spawnBubbles() {
    const wrap = document.getElementById('bubbles');
    for (let i = 0; i < 22; i++) {
      const b = document.createElement('div');
      b.className = 'bubble';
      const size = 18 + Math.random() * 60;
      b.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        animation-duration:${6+Math.random()*10}s;
        animation-delay:${-Math.random()*12}s;
        opacity:${0.2+Math.random()*0.4};
      `;
      wrap.appendChild(b);
    }
  })();

  /* ── 模式选择 ── */
  let currentMode = 'normal';
  const modeLabels = {
    normal:   '🍳 普通模式',
    michelin: '⭐ 米其林',
    dark:     '💀 暗黑料理',
    healing:  '🌸 治愈系',
    squat:    '🏠 蹲门模式',
  };
  const modePrompts = {
    normal:
      '你是一位热情友善的家庭厨师。请根据用户的描述，生成一份详细、实用、步骤清晰的家常食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（大标题）\n3. 用 ## 分隔不同章节（如：## 食材准备、## 烹饪步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表\n6. 重要内容用 **粗体** 标注\n7. 全文使用中文回复\n8. 多用 emoji 增加趣味性\n9. 段落之间空一行，保持清晰排版',
    michelin:
      '你是一位三星米其林主厨。请根据用户的描述，生成一份精致、高端、充满创意的米其林级别食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（大标题）\n3. 用 ## 分隔不同章节（如：## 食材准备、## 烹饪步骤、## 摆盘艺术）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表，注明精确用量\n6. 关键温度、时间用 **粗体** 标注\n7. 全文使用中文回复，可穿插法语术语\n8. 多用 emoji 增加格调\n9. 段落之间空一行，保持优雅排版',
    dark:
      '你是一位专门研究"暗黑料理"的疯狂厨师。请根据用户的描述，生成一份充满奇葩创意、脑洞大开的暗黑食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（要很奇葩）\n3. 用 ## 分隔不同章节（如：## 诡异食材、## 黑暗步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表\n6. 夸张描述用 **粗体** 标注\n7. 全文使用中文回复\n8. 多用 💀🧪⚗️ 等暗黑 emoji\n9. 段落之间空一行，营造戏剧感',
    healing:
      '你是一位温柔的治愈系厨师。请根据用户的描述，生成一份充满爱与温暖的治愈系食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（温暖系）\n3. 用 ## 分隔不同章节（如：## 疗愈食材、## 温暖步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表，注明疗愈功效\n6. 暖心话语用 **粗体** 标注\n7. 全文使用中文回复\n8. 多用 🌸💝🌟 等温暖 emoji\n9. 段落之间空一行，像写信一样温柔排版',
    squat:
      '你是一位精通"蹲门（穷游/省钱）"的生存厨师。请根据用户的描述，生成一份极度省钱、食材易得、操作简单的蹲门食谱。\n\n【输出格式要求】\n1. 使用 Markdown 格式输出\n2. 第一行用 # 写菜名（接地气）\n3. 用 ## 分隔不同章节（如：## 省钱食材、## 快手步骤）\n4. 步骤用 1. 2. 3. 有序列表\n5. 食材用 - 无序列表，注明价格/替代方案\n6. 省钱技巧用 **粗体** 标注\n7. 全文使用中文回复，语气接地气\n8. 多用 🏠💰🍜 等生活 emoji\n9. 段落之间空一行，清晰实用排版',
  };

  document.querySelectorAll('.mode-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      currentMode = btn.dataset.mode;
    });
  });

  /* ── 主函数 ── */
  async function startCooking() {
    const input = document.getElementById('user-input').value.trim();
    if (!input) {
      showError('🧽 哎呀！请先告诉海绵宝宝你想吃什么嘛～');
      return;
    }

    const btn = document.getElementById('cook-btn');
    const loading = document.getElementById('loading');
    const resultSection = document.getElementById('result-section');
    const errorBox = document.getElementById('error-box');

    // 重置
    btn.disabled = true;
    btn.textContent = '🍳 正在烹饪中...';
    loading.style.display = 'block';
    resultSection.style.display = 'none';
    errorBox.style.display = 'none';
    document.getElementById('action-btns').style.display = 'none';

    const systemPrompt = modePrompts[currentMode];
    const userMessage = `请根据以下描述生成食谱：\n\n${input}`;

    try {
      const response = await fetch('/api/chat', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
        },
        body: JSON.stringify({
          model: 'stepfun/step-3.5-flash:free',
          messages: [
            { role: 'system', content: systemPrompt },
            { role: 'user',   content: userMessage  },
          ],
          temperature: 0.9,
          max_tokens: 1800,
          stream: true,
        }),
      });

      if (!response.ok) {
        const errText = await response.text();
        throw new Error(`API 错误 ${response.status}: ${errText}`);
      }

      // 流式输出
      loading.style.display = 'none';
      resultSection.style.display = 'block';
      document.getElementById('mode-badge').textContent = modeLabels[currentMode];

      const outputEl = document.getElementById('recipe-output');
      outputEl.innerHTML = '';

      const reader = response.body.getReader();
      const decoder = new TextDecoder('utf-8');
      let buffer = '';
      let fullText = '';
      let lastRenderTime = 0;

      const renderInterval = 120; // 每 120ms 最多渲染一次，防抖

      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });

        const lines = buffer.split('\n');
        buffer = lines.pop();

        for (const line of lines) {
          const trimmed = line.trim();
          if (!trimmed || trimmed === 'data: [DONE]') continue;
          if (!trimmed.startsWith('data: ')) continue;
          try {
            const json = JSON.parse(trimmed.slice(6));
            const delta = json.choices?.[0]?.delta?.content;
            if (delta) {
              fullText += delta;
              const now = Date.now();
              if (now - lastRenderTime >= renderInterval) {
                lastRenderTime = now;
                outputEl.innerHTML = marked.parse(fullText);
              }
            }
          } catch (_) { /* 忽略解析错误 */ }
        }
      }

      // 最后完整渲染一次
      outputEl.innerHTML = marked.parse(fullText);

      // 显示操作按钮
      document.getElementById('action-btns').style.display = 'flex';

      // 滚动到结果
      resultSection.scrollIntoView({ behavior: 'smooth', block: 'start' });

    } catch (err) {
      loading.style.display = 'none';
      showError(`😱 哎呀，厨房着火了！${err.message}`);
    } finally {
      btn.disabled = false;
      btn.innerHTML = '<span class="btn-shine"></span>🍔 再来一道！继续烹饪！';
    }
  }

  // ── Markdown 渲染 ──
  function renderMarkdown(el) {
    const raw = el.textContent || '';
    // 配置 marked 选项
    marked.setOptions({
      breaks: true,       // 换行变 <br>
      gfm: true,          // GitHub Flavored Markdown
    });
    el.innerHTML = marked.parse(raw);
  }

  /* ── Toast 提示 ── */
  function showToast(msg) {
    const toast = document.getElementById('toast');
    toast.textContent = msg;
    toast.classList.add('show');
    setTimeout(() => toast.classList.remove('show'), 2200);
  }

  /* ── 复制食谱 ── */
  function copyRecipe() {
    const text = document.getElementById('recipe-output').textContent;
    if (!text) return;
    navigator.clipboard.writeText(text).then(() => {
      const btn = document.getElementById('copy-btn');
      btn.textContent = '✅ 已复制';
      btn.classList.add('copied');
      setTimeout(() => {
        btn.textContent = '📋 复制';
        btn.classList.remove('copied');
      }, 2000);
      showToast('📋 食谱已复制到剪贴板！');
    }).catch(() => {
      showToast('复制失败，请手动选择复制~');
    });
  }

  /* ── 分享食谱（生成含食谱内容的 URL） ── */
  function shareRecipe() {
    const outputEl = document.getElementById('recipe-output');
    if (!outputEl.textContent) return;

    // 食谱文字 + 模式
    const recipeText = outputEl.textContent;
    const mode = document.getElementById('mode-badge').textContent;

    // 生成 URL（含食谱内容做快照）
    const shareUrl = generateShareUrl(recipeText, mode);

    document.getElementById('share-link-input').value = shareUrl;
    document.getElementById('share-modal').classList.add('open');
  }

  /* ── 生成分享 URL（食谱快照模式） ── */
  function generateShareUrl(recipeText, mode) {
    // 安全处理中文：encodeURIComponent 可处理任意 Unicode
    const encoded = encodeURIComponent(recipeText);
    const modeParam = encodeURIComponent(mode);
    // 当前页面 URL（DNS 配置好后自动用正式域名）
    const pageUrl = window.location.origin + window.location.pathname;
    return `${pageUrl}#recipe=${encoded}&mode=${modeParam}`;
  }

  /* ── 从分享链接恢复食谱 ── */
  function loadFromShare() {
    const hash = window.location.hash;
    if (!hash.includes('#recipe=')) return;
    try {
      const params = new URLSearchParams(hash.slice(1));
      const encoded = params.get('recipe');
      const mode = params.get('mode');
      if (!encoded) return;
      const recipeText = decodeURIComponent(encoded);
      const outputEl = document.getElementById('recipe-output');
      outputEl.textContent = recipeText;
      renderMarkdown(outputEl);
      if (mode) document.getElementById('mode-badge').textContent = decodeURIComponent(mode);
      // 显示结果区 + 操作按钮
      document.getElementById('result-section').style.display = 'block';
      document.getElementById('action-btns').style.display = 'flex';
      document.getElementById('loading').style.display = 'none';
      // 清理 hash
      history.replaceState(null, '', window.location.pathname);
    } catch(e) {
      console.warn('分享链接解析失败:', e);
    }
  }

  /* ── 复制分享链接 ── */
  function copyShareLink() {
    const input = document.getElementById('share-link-input');
    navigator.clipboard.writeText(input.value).then(() => {
      showToast('🔗 分享链接已复制！');
      setTimeout(closeShareModal, 600);
    }).catch(() => {
      input.select();
      document.execCommand('copy');
      showToast('🔗 分享链接已复制！');
      setTimeout(closeShareModal, 600);
    });
  }

  /* ── 关闭分享弹窗 ── */
  function closeShareModal() {
    document.getElementById('share-modal').classList.remove('open');
  }

  // 点击弹窗背景关闭
  document.getElementById('share-modal').addEventListener('click', e => {
    if (e.target.id === 'share-modal') closeShareModal();
  });

  /* ── 错误显示 ── */
  function showError(msg) {
    const box = document.getElementById('error-box');
    box.textContent = msg;
    box.style.display = 'block';
  }

  /* ── 回车快捷键 ── */
  document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) startCooking();
  });

  /* ── 页面加载时检查分享链接 ── */
  window.addEventListener('DOMContentLoaded', () => {
    loadFromShare();
  });
</script>
