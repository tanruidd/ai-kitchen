<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍔 美味创意AI厨房 | 比奇堡蟹堡王特供</title>

  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="./modules/modes.js"></script>

  <link rel="stylesheet" href="./assets/style.css">
</head>
<body>

<!-- 气泡背景 -->
<div class="bubbles" id="bubbles"></div>

<!-- 历史记录按钮 -->
<button class="history-toggle-btn" id="history-toggle-btn" onclick="toggleHistory()" title="历史记录">
  📜
  <span class="history-count" id="history-count" style="display:none;">0</span>
</button>

<!-- BGM 按钮 -->
<button class="bgm-btn" id="bgm-btn"
  onmousedown="window._bgmTimer=setTimeout(toggleBgmPanel,400)"
  onmouseup="clearTimeout(window._bgmTimer)"
  onmouseleave="clearTimeout(window._bgmTimer)"
  ontouchstart="window._bgmTimer=setTimeout(toggleBgmPanel,400)"
  ontouchend="clearTimeout(window._bgmTimer)"
  onclick="BGM.toggle()"
  title="开启背景音乐（长按切换曲目）">
  🔇
</button>

<!-- BGM 曲目面板 -->
<div class="bgm-panel" id="bgm-panel">
  <div class="bgm-panel-header">
    <span>🎵 背景音乐</span>
    <button class="bgm-panel-close" onclick="toggleBgmPanel()">✕</button>
  </div>
  <div class="bgm-tracks" id="bgm-tracks"></div>
</div>

<!-- 历史记录面板 -->
<div class="history-overlay" id="history-overlay" onclick="toggleHistory()"></div>
<div class="history-panel" id="history-panel">
  <div class="history-panel-header">
    <h3>📜 历史记录</h3>
    <button class="history-panel-close" onclick="toggleHistory()">✕</button>
  </div>
  <div class="history-tabs">
    <button class="history-tab active" id="tab-history" onclick="switchHistoryTab('history')">最近</button>
    <button class="history-tab" id="tab-fav" onclick="switchHistoryTab('fav')">⭐ 收藏</button>
  </div>
  <div class="history-search-wrap">
    <input
      class="history-search"
      id="history-search"
      type="text"
      placeholder="🔍 搜索食谱..."
      oninput="onHistorySearch(this.value)"
    />
  </div>
  <div class="history-list" id="history-list"></div>
  <div class="history-empty" id="history-empty">
    <span class="empty-icon">📭</span>
    还没有生成过食谱<br/>快去创作第一道菜吧！
  </div>
  <div class="history-panel-footer">
    <button class="history-footer-btn" onclick="exportHistory()">📥 导出</button>
    <button class="history-footer-btn" onclick="importHistory()">📤 导入</button>
    <button class="history-footer-btn danger" onclick="clearHistory()">🗑️ 清空</button>
  </div>
</div>

<div class="container">

  <!-- 头部 -->
  <header>
    <div class="logo-wrap">🧽</div>
    <h1>美味创意 AI 厨房</h1>
    <p class="subtitle">🦀 蟹老板御用 · 比奇堡最强食谱生成器 · 海绵宝宝亲自研发 🍔</p>
  </header>

  <!-- 输入卡片 -->
  <div class="card">
    <div class="label">🍽️ 告诉我你想吃什么 / 你的心情</div>
    <div class="input-row">
      <textarea
        id="user-input"
        placeholder="例如：我今天很累，想吃一碗暖暖的汤面 🍜&#10;或者：帮我做一道能让朋友惊艳的派对菜 🎉&#10;或者：我只有鸡蛋和番茄，能做什么？ 🍅"
      ></textarea>
      <button class="inspire-btn" id="inspire-btn" onclick="randomInspire()" title="随机灵感">
        🎲
      </button>
    </div>
    <div class="ingredient-label">🏷️ 快速添加食材</div>
    <div class="ingredient-tags" id="ingredient-tags"></div>
  </div>

  <!-- 模式卡片 -->
  <div class="card">
    <div class="label">🔥 选择烹饪模式</div>
    <div class="modes">
      <button class="mode-btn active" data-mode="normal">
        <span class="mode-icon">🍳</span>普通模式
      </button>
      <button class="mode-btn" data-mode="michelin">
        <span class="mode-icon">⭐</span>米其林
      </button>
      <button class="mode-btn" data-mode="dark">
        <span class="mode-icon">💀</span>暗黑料理
      </button>
      <button class="mode-btn" data-mode="healing">
        <span class="mode-icon">🌸</span>治愈系
      </button>
      <button class="mode-btn" data-mode="squat">
        <span class="mode-icon">🏠</span>蹲门模式
      </button>
      <button class="mode-btn" data-mode="street">
        <span class="mode-icon">🏮</span>摆摊小吃
      </button>
    </div>
  </div>

  <!-- 按钮 -->
  <button class="cook-btn" id="cook-btn" onclick="startCooking()">
    <span class="btn-shine"></span>
    🍔 开始烹饪！让海绵宝宝大显身手！
  </button>

  <!-- 加载 -->
  <div class="loading-wrap" id="loading">
    <div class="pan">🍳</div>
    <div class="loading-text">海绵宝宝正在厨房疯狂烹饪<span class="dots"></span></div>
    <div class="loading-hint">🙏 请不要离开页面，否则食谱会消失哦～</div>
  </div>

  <!-- 错误 -->
  <div class="error-box" id="error-box"></div>

  <!-- 结果卡片 -->
  <div class="card" id="result-section">
    <div class="result-header">
      <h2>🎉 食谱出炉啦！</h2>
      <span class="mode-badge" id="mode-badge"></span>
      <div class="action-btns" id="action-btns" style="display:none;">
        <button class="action-btn" id="copy-btn" onclick="copyRecipe()" title="复制食谱">
          📋 复制
        </button>
        <button class="action-btn" id="share-btn" onclick="shareRecipe()" title="分享食谱">
          🖼️ 分享图片
        </button>
      </div>
    </div>
    <div id="recipe-output"></div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <!-- 图片预览弹窗 -->
  <div class="preview-modal" id="preview-modal">
    <div class="preview-modal-inner">
      <h3>🖼️ 食谱图片预览</h3>
      <div class="preview-img-wrap">
        <img id="preview-img" src="" alt="食谱预览" />
      </div>
      <div class="preview-actions">
        <button class="preview-download-btn" id="preview-download-btn">
          💾 保存图片
        </button>
        <button class="preview-cancel-btn" onclick="closePreviewModal()">
          取消
        </button>
      </div>
    </div>
  </div>

  <!-- 分享卡片（截图用，隐藏在视口外） -->
  <div class="share-card" id="share-card">
    <div class="share-card-header">
      <div class="share-card-logo">🧽</div>
      <div>
        <div class="share-card-title">美味创意 AI 厨房</div>
        <div class="share-card-subtitle">🦀 比奇堡蟹堡王特供 · AI 生成食谱</div>
        <div class="share-card-mode" id="share-card-mode">🍳 普通模式</div>
      </div>
    </div>
    <div class="share-card-divider"></div>
    <div class="share-card-recipe" id="share-card-recipe"></div>
    <div class="share-card-footer">🍔 由美味创意 AI 厨房生成 · 每一道菜都是爱 ❤️</div>
  </div>

  <footer>
    🧽 由海绵宝宝 × 蟹老板联合出品 · 比奇堡 AI 厨房 · 每一道菜都是爱 ❤️
  </footer>

</div>

<script src="./modules/utils.js"></script>
<script src="./modules/sfx.js"></script>
<script src="./modules/bgm.js"></script>
<script src="./modules/history.js"></script>
<script src="./modules/inspire.js"></script>
<script src="./modules/image.js"></script>
<script src="./modules/share.js"></script>
<script src="./modules/cooking.js"></script>
<script>
  // ── 页面初始化 ──
  spawnBubbles();
  window.addEventListener('DOMContentLoaded', () => {
    updateHistoryBadge();
  });
</script>
</body>
</html>
